<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0a462e" />
      <stop offset="70%" stop-color="#062D1D" />
      <stop offset="100%" stop-color="#031A10" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CE" />
      <stop offset="35%" stop-color="#DFBE75" />
      <stop offset="75%" stop-color="#C6A66B" />
      <stop offset="100%" stop-color="#795910" />
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBE75" />
      <stop offset="50%" stop-color="#795910" />
      <stop offset="100%" stop-color="#DFBE75" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bg)" />

  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="226" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="6,6" stroke-opacity="0.6" />

  <!-- Shield -->
  <path d="M 256,90 L 370,140 C 370,270 256,365 256,365 C 256,365 142,270 142,140 Z" fill="#062D1D" stroke="url(#shieldBorder)" stroke-width="8" stroke-linejoin="round" />

  <!-- Crown on Top of Shield -->
  <path d="M 216,135 L 230,165 L 256,135 L 282,165 L 296,135 L 290,185 L 222,185 Z" fill="url(#gold)" />
  <circle cx="216" cy="130" r="4" fill="url(#gold)" />
  <circle cx="256" cy="130" r="4" fill="url(#gold)" />
  <circle cx="296" cy="130" r="4" fill="url(#gold)" />

  <!-- Crossed Polo Mallets Inside Shield -->
  <g stroke="url(#gold)" stroke-width="6" stroke-linecap="round">
    <line x1="180" y1="310" x2="332" y2="190" />
    <line x1="332" y1="310" x2="180" y2="190" />
  </g>
  <!-- Mallet Heads -->
  <rect x="325" y="180" width="22" height="9" rx="3" transform="rotate(-38 336 185)" fill="url(#gold)" />
  <rect x="165" y="180" width="22" height="9" rx="3" transform="rotate(38 176 185)" fill="url(#gold)" />
  
  <!-- Central Polo Ball -->
  <circle cx="256" cy="250" r="18" fill="#FFF2CE" stroke="#795910" stroke-width="3" />

  <!-- 1928 Inscription -->
  <text x="256" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="800" fill="url(#gold)" text-anchor="middle" letter-spacing="4">EST. 1928</text>

  <!-- Circular Wordmark -->
  <text x="256" y="420" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="3">ABEOKUTA POLO</text>
  <text x="256" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="600" fill="url(#gold)" text-anchor="middle" letter-spacing="6">FESTIVAL 2026</text>
</svg>
